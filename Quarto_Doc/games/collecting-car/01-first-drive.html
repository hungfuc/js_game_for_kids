<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treasure Car: First Drive</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 18px system-ui, sans-serif; color: #19324b; background: #e9f7f5; }
    main { width: min(94vw, 660px); padding: 20px; background: white; border: 3px solid #19324b; border-radius: 18px; }
    h1 { margin: 0; color: #125a70; }
    canvas { display: block; width: 100%; height: auto; border: 2px solid #19324b; background: #d8f2df; }
    #status { min-height: 1.5em; font-weight: bold; }
  </style>
</head>
<body>
  <main>
    <h1>Treasure Car: First Drive</h1>
    <p>Drive with the arrow keys. Pick up the yellow coins!</p>
    <canvas id="game" width="600" height="360" aria-label="A car collecting coins in a garden"></canvas>
    <p id="status" role="status">Coins: 0</p>
  </main>
  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");
    const keys = {};
    const car = { x: 280, y: 160, w: 40, h: 28, speed: 3 };
    const coins = [
      { x: 90, y: 80, r: 12 },
      { x: 480, y: 110, r: 12 },
      { x: 350, y: 285, r: 12 }
    ];
    let score = 0;

    window.addEventListener("keydown", event => {
      if (event.key.startsWith("Arrow")) event.preventDefault();
      keys[event.key] = true;
    });
    window.addEventListener("keyup", event => { keys[event.key] = false; });
    window.addEventListener("blur", () => { for (const key in keys) keys[key] = false; });

    function update() {
      if (keys.ArrowLeft) car.x -= car.speed;
      if (keys.ArrowRight) car.x += car.speed;
      if (keys.ArrowUp) car.y -= car.speed;
      if (keys.ArrowDown) car.y += car.speed;
      car.x = Math.max(0, Math.min(canvas.width - car.w, car.x));
      car.y = Math.max(0, Math.min(canvas.height - car.h, car.y));
      for (let i = coins.length - 1; i >= 0; i--) {
        const coin = coins[i];
        const nearX = Math.max(car.x, Math.min(coin.x, car.x + car.w));
        const nearY = Math.max(car.y, Math.min(coin.y, car.y + car.h));
        if ((coin.x - nearX) ** 2 + (coin.y - nearY) ** 2 <= coin.r ** 2) {
          coins.splice(i, 1);
          score++;
          status.textContent = coins.length ? `Coins: ${score}` : `Coins: ${score}. All collected!`;
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#bde7c6";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.setLineDash([16, 12]);
      ctx.beginPath(); ctx.moveTo(0, 180); ctx.lineTo(600, 180); ctx.stroke();
      ctx.setLineDash([]);
      for (const coin of coins) {
        ctx.beginPath(); ctx.arc(coin.x, coin.y, coin.r, 0, Math.PI * 2);
        ctx.fillStyle = "#ffd34e"; ctx.fill();
        ctx.strokeStyle = "#a46a00"; ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.fillStyle = "#1675b8";
      ctx.fillRect(car.x, car.y, car.w, car.h);
      ctx.fillStyle = "#94d8fa";
      ctx.fillRect(car.x + 8, car.y + 4, 24, 11);
      ctx.fillStyle = "#18324b";
      ctx.fillRect(car.x + 5, car.y + 20, 9, 8);
      ctx.fillRect(car.x + 27, car.y + 20, 9, 8);
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    draw();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
