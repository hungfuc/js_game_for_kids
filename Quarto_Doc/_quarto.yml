project:
  type: book
  output-dir: _book
  resources:
  - games/**
book:
  title: "Web Game Coding for Kids"
  subtitle: "Learn JavaScript by Building 2D and 3D Games"
  author: "Hung-Fu Chang, Ph.D. and Wenhui Zhu, Ph.D."
  search: true
  sidebar:
    style: docked
    background: light
    collapse-level: 2
  chapters:
  - index.qmd
  - part: Web Foundation
    chapters:
    - chapters/01-computer-and-web-basics.qmd
    - chapters/02-game-design.qmd
    - chapters/03-scene-structure.qmd
    - chapters/04-scene-style.qmd
    - chapters/05-game-behavior.qmd
  - part: Dynamic Game Behaviors
    chapters:
    - chapters/06-variables-monster-starter.qmd
    - chapters/07-dom-and-event-driven-programming.qmd
    - chapters/08-monster-decisions.qmd
    - chapters/09-monster-loops.qmd
    - chapters/10-catch-the-star.qmd
  - part: Build a Local 2D Game
    chapters:
    - chapters/11-bouncing-ball.qmd
    - chapters/12-pong.qmd
    - chapters/13-breakout.qmd
    - chapters/14-snake.qmd
  - part: 2D Games in Server 
    chapters:
    - chapters/15-game-studio.qmd
    - chapters/16-real-time-2d.qmd
    - chapters/17-collision-and-platforms.qmd
    - chapters/18-custom-2d-assets.qmd
    - chapters/19-robot-orchard.qmd
  - part: Explore 3D with Three.js and Rapier
    chapters:
    - chapters/20-first-threejs-world.qmd
    - chapters/21-custom-3d-assets.qmd
    - chapters/22-rapier-physics.qmd
    - chapters/23-marble-quest.qmd
  - references.qmd
  appendices:
  - appendices/a-cheat-sheet.qmd
  - appendices/b-debugging.qmd
  - appendices/c-phaser.qmd
  - appendices/d-self-check.qmd
  - appendices/e-game-lab.qmd
  - appendices/f-html-css-reference.qmd
lang: en
number-sections: true
number-depth: 2
toc-depth: 2
format:
  html:
    theme:
    - cosmo
    - styles/textbook.scss
    css: styles/textbook.css
    toc: true
    toc-title: In this chapter
    code-copy: true
    code-overflow: wrap
    highlight-style: pygments
    anchor-sections: true
    link-external-newwindow: true
    link-external-icon: false
    smooth-scroll: true
    fig-cap-location: bottom
    callout-appearance: default
    callout-icon: false
execute:
  eval: false
