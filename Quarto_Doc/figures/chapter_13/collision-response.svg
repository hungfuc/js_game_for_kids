<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img"><title>Touching an object is not the same as stopping at it</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2f66c8"/></marker></defs><rect width="1080" height="590" rx="18" fill="#f4f7fd"/><text x="36" y="49" fill="#203654" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Touching an object is not the same as stopping at it</tspan></text><text x="40" y="99" fill="#2f66c8" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="40" dy="0">Detect overlap</tspan></text><rect x="65" y="139" width="190" height="120" fill="#d6e7ff" stroke="#2f66c8" stroke-width="3"/><rect x="190" y="207" width="210" height="130" fill="#dfd0f3" stroke="#7950ad" stroke-width="3"/><rect x="190" y="207" width="65" height="52" fill="#f3b5c6" stroke="#b43c61" stroke-width="3"/><text x="80" y="176" fill="#2f66c8" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start"><tspan x="80" dy="0">A</tspan></text><text x="351" y="304" fill="#7950ad" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start"><tspan x="351" dy="0">B</tspan></text><text x="45" y="384" fill="#203654" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="45" dy="0">Overlap on x AND y.</tspan><tspan x="45" dy="29.700000000000003">Pink is the shared area.</tspan></text><text x="530" y="99" fill="#20866f" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="530" dy="0">Respond: land on top</tspan></text><rect x="555" y="283" width="190" height="40" fill="#bde6cd" stroke="#20866f" stroke-width="3"/><rect x="605" y="198" width="52" height="102" fill="#d6e7ff" stroke="#2f66c8" stroke-width="3"/><path d="M631 163 L631 193" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><text x="770" y="217" fill="#203654" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="770" dy="0">Before: feet went</tspan><tspan x="770" dy="28.35">inside the platform.</tspan></text><path d="M650 348 L650 394" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><rect x="555" y="467" width="190" height="40" fill="#bde6cd" stroke="#20866f" stroke-width="3"/><rect x="605" y="365" width="52" height="102" fill="#d6e7ff" stroke="#2f66c8" stroke-width="3"/><text x="770" y="403" fill="#203654" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="770" dy="0">After: move up to</tspan><tspan x="770" dy="28.35">platform.y - player.h</tspan><tspan x="770" dy="28.35">vy = 0</tspan><tspan x="770" dy="28.35">grounded = true</tspan></text><text x="40" y="467" fill="#203654" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="40" dy="0">Detection answers a question.</tspan><tspan x="40" dy="32.400000000000006">Response changes the state.</tspan></text></svg>