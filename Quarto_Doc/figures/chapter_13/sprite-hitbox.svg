<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img"><title>Choose a sprite frame; keep the hitbox stable</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2f66c8"/></marker></defs><rect width="1080" height="590" rx="18" fill="#f4f7fd"/><text x="36" y="49" fill="#203654" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Choose a sprite frame; keep the hitbox stable</tspan></text><text x="42" y="102" fill="#2f66c8" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="42" dy="0">Source sprite sheet: 256 x 64 pixels</tspan></text><image href="data:image/svg+xml;base64," x="50" y="128" width="512" height="128"/><rect x="50" y="128" width="128" height="128" fill="none" stroke="#2f66c8" stroke-dasharray="6 5"/><text x="114" y="293" fill="#203654" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle"><tspan x="114" dy="0">frame 0</tspan></text><rect x="178" y="128" width="128" height="128" fill="none" stroke="#2f66c8" stroke-dasharray="6 5"/><text x="242" y="293" fill="#203654" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle"><tspan x="242" dy="0">frame 1</tspan></text><rect x="306" y="128" width="128" height="128" fill="none" stroke="#2f66c8" stroke-dasharray="6 5"/><text x="370" y="293" fill="#203654" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle"><tspan x="370" dy="0">frame 2</tspan></text><rect x="434" y="128" width="128" height="128" fill="none" stroke="#2f66c8" stroke-dasharray="6 5"/><text x="498" y="293" fill="#203654" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="middle"><tspan x="498" dy="0">frame 3</tspan></text><text x="48" y="350" fill="#203654" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start"><tspan x="48" dy="0">Pick frame 2: source x = 2 x 64 = 128</tspan><tspan x="48" dy="31.05">Copy a 64 x 64 crop.</tspan><tspan x="48" dy="31.05">Draw it at the player position.</tspan></text><path d="M571 206 L688 206" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><rect x="743" y="139" width="144" height="192" fill="#e1f4f0" stroke="#20866f" stroke-width="3"/><text x="720" y="105" fill="#20866f" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="720" dy="0">Visible artwork</tspan></text><svg x="743" y="139" width="144" height="192" viewBox="128 0 64 64"><image href="data:image/svg+xml;base64," width="256" height="64"/></svg><rect x="776" y="198" width="84" height="126" fill="none" stroke="#b43c61" stroke-width="4" stroke-dasharray="7 5"/><text x="692" y="375" fill="#203654" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="692" dy="0">Hitbox: simple rectangle</tspan><tspan x="692" dy="29.700000000000003">Artwork: larger picture</tspan><tspan x="692" dy="29.700000000000003">Changing a hat should not</tspan><tspan x="692" dy="29.700000000000003">change where feet land.</tspan></text><text x="45" y="515" fill="#203654" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="45" dy="0">The animation frame changes the picture, not the collision rectangle.</tspan></text></svg>