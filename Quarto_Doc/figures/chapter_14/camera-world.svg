<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img"><title>A scrolling camera is a window, not a second world</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2f66c8"/></marker></defs><rect width="1080" height="590" rx="18" fill="#f4f7fd"/><text x="36" y="49" fill="#203654" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start"><tspan x="36" dy="0">A scrolling camera is a window, not a second world</tspan></text><text x="45" y="102" fill="#2f66c8" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="45" dy="0">The level stays in world coordinates.</tspan></text><rect x="50" y="142" width="980" height="120" fill="#d5ecdf" stroke="#20866f" stroke-width="3"/><rect x="90" y="224" width="65" height="38" fill="#b9794d"/><rect x="300" y="224" width="65" height="38" fill="#b9794d"/><rect x="590" y="224" width="65" height="38" fill="#b9794d"/><rect x="840" y="224" width="65" height="38" fill="#b9794d"/><rect x="400" y="141" width="366" height="122" fill="#c4dafa" fill-opacity=".55" stroke="#2f66c8" stroke-width="4"/><rect x="571" y="192" width="24" height="47" fill="#26ac9d"/><text x="578" y="180" fill="#203654" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><tspan x="578" dy="0">player</tspan></text><text x="52" y="299" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="52" dy="0">world x = 0</tspan></text><text x="400" y="299" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="400" dy="0">camera x = 1020</tspan></text><text x="818" y="299" fill="#203654" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="818" dy="0">level width = 2560</tspan></text><rect x="60" y="353" width="425" height="137" rx="14" fill="white" stroke="#20866f" stroke-width="2"/><text x="78" y="387" fill="#20866f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="78" dy="0">World position</tspan></text><text x="78" y="423" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="78" dy="0">player.x = 1500</tspan><tspan x="78" dy="27.0">Do collision tests here.</tspan></text><rect x="595" y="353" width="425" height="137" rx="14" fill="white" stroke="#7950ad" stroke-width="2"/><text x="613" y="387" fill="#7950ad" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="613" dy="0">Screen position</tspan></text><text x="613" y="423" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="613" dy="0">1500 - 1020 = 480</tspan><tspan x="613" dy="27.0">Draw at x = 480 on the canvas.</tspan></text><path d="M487 421 L590 421" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><text x="52" y="540" fill="#203654" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="52" dy="0">Moving the camera changes the view, not the game rules.</tspan></text></svg>