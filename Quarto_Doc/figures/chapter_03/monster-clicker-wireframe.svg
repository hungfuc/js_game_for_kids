<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-labelledby="title desc">
  <title id="title">Monster Clicker scene wireframe</title>
  <desc id="desc">Five boxes in reading order show the game title, instructions, monster button, score, and feedback message.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #183253; }
    .label { font-size: 22px; font-weight: 700; }
    .small { font-size: 18px; }
    .part { fill: #fff; stroke: #71869a; stroke-width: 2; }
  </style>
  <rect width="900" height="550" rx="18" fill="#eef3f7"/>
  <text x="450" y="45" text-anchor="middle" class="label">Monster Clicker: a scene plan</text>
  <rect x="100" y="72" width="700" height="75" rx="8" class="part"/>
  <text x="450" y="119" text-anchor="middle" class="label">Title: Monster Clicker</text>
  <rect x="100" y="163" width="700" height="70" rx="8" class="part"/>
  <text x="450" y="206" text-anchor="middle" class="small">Instructions: Click the monster to collect points.</text>
  <rect x="235" y="249" width="430" height="85" rx="10" fill="#e6f6f2" stroke="#71869a" stroke-width="2"/>
  <text x="450" y="301" text-anchor="middle" class="label">Monster button</text>
  <rect x="100" y="350" width="700" height="70" rx="8" class="part"/>
  <text x="450" y="393" text-anchor="middle" class="small">Score: 0</text>
  <rect x="100" y="436" width="700" height="70" rx="8" class="part"/>
  <text x="450" y="479" text-anchor="middle" class="small">Message: Your adventure is ready.</text>
</svg>
