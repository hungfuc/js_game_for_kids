<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc"><title id="title">Four edge checks and the velocity each one reverses</title><desc id="desc">Four panels show a ball just past the left, right, top, and bottom contact boundaries. Left and right reverse dx; top and bottom reverse dy. Arrows show incoming and outgoing directions.</desc><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b64444"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147d68"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2f66c8"/></marker></defs><rect width="1000" height="810" rx="18" fill="#f4f7fd"/><g font-family="Arial, sans-serif"><text x="30" y="42" font-size="29" fill="#203654" font-weight="700" text-anchor="start">A wall changes one part of the ball’s velocity</text><text x="30" y="77" font-size="22" fill="#203654" font-weight="400" text-anchor="start">x and y locate the center. The radius reaches from the center to the edge.</text><rect x="25" y="105" width="470" height="292" rx="12" fill="white" stroke="#d5dfed" stroke-width="2"/><text x="43" y="137" font-size="25" fill="#2f66c8" font-weight="700" text-anchor="start">Left wall</text><path d="M100 165 L100 270" fill="none" stroke="#2f66c8" stroke-width="3"/><circle cx="120" cy="218" r="24" fill="#dfd0f3" stroke="#7950ad" stroke-width="3"/><circle cx="120" cy="218" r="3" fill="#203654"/><path d="M225 190 L150 190" fill="none" stroke="#b64444" stroke-width="3" marker-end="url(#red)"/><path d="M150 246 L225 246" fill="none" stroke="#147d68" stroke-width="3" marker-end="url(#green)"/><text x="240" y="205" font-size="20" fill="#203654" font-weight="400" text-anchor="start">in → wall → out</text><text x="240" y="238" font-size="20" fill="#203654" font-weight="400" text-anchor="start">dy stays the same</text><text x="100" y="293" font-size="18" fill="#203654" font-weight="400" text-anchor="middle">x = 0</text><text x="43" y="329" font-size="22" fill="#203654" font-weight="700" text-anchor="start">x &lt; radius</text><text x="43" y="365" font-size="21" fill="#203654" font-weight="400" text-anchor="start">dx = -dx: negative → positive</text><rect x="515" y="105" width="470" height="292" rx="12" fill="white" stroke="#d5dfed" stroke-width="2"/><text x="533" y="137" font-size="25" fill="#2f66c8" font-weight="700" text-anchor="start">Right wall</text><path d="M910 165 L910 270" fill="none" stroke="#2f66c8" stroke-width="3"/><circle cx="890" cy="218" r="24" fill="#dfd0f3" stroke="#7950ad" stroke-width="3"/><circle cx="890" cy="218" r="3" fill="#203654"/><path d="M785 190 L860 190" fill="none" stroke="#b64444" stroke-width="3" marker-end="url(#red)"/><path d="M860 246 L785 246" fill="none" stroke="#147d68" stroke-width="3" marker-end="url(#green)"/><text x="540" y="205" font-size="20" fill="#203654" font-weight="400" text-anchor="start">in → wall → out</text><text x="540" y="238" font-size="20" fill="#203654" font-weight="400" text-anchor="start">dy stays the same</text><text x="910" y="293" font-size="18" fill="#203654" font-weight="400" text-anchor="middle">x = canvas.width</text><text x="533" y="329" font-size="22" fill="#203654" font-weight="700" text-anchor="start">x &gt; canvas.width - radius</text><text x="533" y="365" font-size="21" fill="#203654" font-weight="400" text-anchor="start">dx = -dx: positive → negative</text><rect x="25" y="415" width="470" height="292" rx="12" fill="white" stroke="#d5dfed" stroke-width="2"/><text x="43" y="447" font-size="25" fill="#2f66c8" font-weight="700" text-anchor="start">Top wall</text><path d="M65 490 L187 490" fill="none" stroke="#2f66c8" stroke-width="3"/><circle cx="120" cy="510" r="24" fill="#dfd0f3" stroke="#7950ad" stroke-width="3"/><circle cx="120" cy="510" r="3" fill="#203654"/><path d="M86 573 L86 520" fill="none" stroke="#b64444" stroke-width="3" marker-end="url(#red)"/><path d="M154 520 L154 573" fill="none" stroke="#147d68" stroke-width="3" marker-end="url(#green)"/><text x="215" y="510" font-size="20" fill="#203654" font-weight="400" text-anchor="start">y = 0</text><text x="215" y="547" font-size="20" fill="#203654" font-weight="400" text-anchor="start">dx stays the same</text><text x="43" y="639" font-size="22" fill="#203654" font-weight="700" text-anchor="start">y &lt; radius</text><text x="43" y="675" font-size="21" fill="#203654" font-weight="400" text-anchor="start">dy = -dy: negative → positive</text><rect x="515" y="415" width="470" height="292" rx="12" fill="white" stroke="#d5dfed" stroke-width="2"/><text x="533" y="447" font-size="25" fill="#2f66c8" font-weight="700" text-anchor="start">Bottom wall</text><path d="M555 575 L677 575" fill="none" stroke="#2f66c8" stroke-width="3"/><circle cx="610" cy="555" r="24" fill="#dfd0f3" stroke="#7950ad" stroke-width="3"/><circle cx="610" cy="555" r="3" fill="#203654"/><path d="M576 492 L576 545" fill="none" stroke="#b64444" stroke-width="3" marker-end="url(#red)"/><path d="M644 545 L644 492" fill="none" stroke="#147d68" stroke-width="3" marker-end="url(#green)"/><text x="705" y="510" font-size="20" fill="#203654" font-weight="400" text-anchor="start">y = canvas.height</text><text x="705" y="547" font-size="20" fill="#203654" font-weight="400" text-anchor="start">dx stays the same</text><text x="533" y="639" font-size="22" fill="#203654" font-weight="700" text-anchor="start">y &gt; canvas.height - radius</text><text x="533" y="675" font-size="21" fill="#203654" font-weight="400" text-anchor="start">dy = -dy: positive → negative</text><text x="30" y="754" font-size="22" fill="#203654" font-weight="400" text-anchor="start">Red arrow: moving in. Green arrow: moving out. Down is positive y.</text><text x="30" y="786" font-size="22" fill="#203654" font-weight="400" text-anchor="start">At a corner, both checks can be true: reverse both dx and dy.</text></g></svg>