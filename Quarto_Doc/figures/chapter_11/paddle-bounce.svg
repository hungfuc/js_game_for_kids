<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="910" viewBox="0 0 1000 910" role="img" aria-labelledby="title desc"><title id="title">Bounding-box detection and paddle-bounce response</title><desc id="desc">A dashed square around the ball overlaps the paddle on both axes. All four comparisons must hold. If dx is positive, reposition the center one radius left of the paddle, set dx negative, and count a hit. dy stays unchanged.</desc><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b64444"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147d68"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2f66c8"/></marker></defs><rect width="1000" height="910" rx="18" fill="#f4f7fd"/><g font-family="Arial, sans-serif"><text x="30" y="42" font-size="29" fill="#203654" font-weight="700" text-anchor="start">Paddle bounce: detect overlap, then change direction</text><text x="30" y="78" font-size="22" fill="#203654" font-weight="400" text-anchor="start">Use the ball’s bounding square for this simple collision test.</text><rect x="25" y="100" width="950" height="375" rx="12" fill="white" stroke="#d5dfed" stroke-width="2"/><text x="45" y="135" font-size="25" fill="#2f66c8" font-weight="700" text-anchor="start">1  Detect: all four comparisons must be true</text><rect x="330" y="187" width="55" height="190" rx="0" fill="#bde6f5" stroke="#2f66c8" stroke-width="2"/><circle cx="300" cy="270" r="40" fill="#dfd0f3" stroke="#7950ad" stroke-width="3"/><circle cx="300" cy="270" r="3" fill="#203654"/><rect x="260" y="230" width="80" height="80" fill="none" stroke="#7950ad" stroke-width="2" stroke-dasharray="6 5"/><rect x="330" y="230" width="10" height="80" fill="#b64444" opacity=".55"/><text x="70" y="183" font-size="20" fill="#7950ad" font-weight="400" text-anchor="start">ball’s bounding square</text><path d="M225 190 L270 229" fill="none" stroke="#7950ad" stroke-width="3"/><text x="338" y="171" font-size="20" fill="#2f66c8" font-weight="400" text-anchor="start">paddle</text><text x="85" y="342" font-size="20" fill="#203654" font-weight="400" text-anchor="start">center: (ballX, ballY)</text><path d="M255 330 L298 274" fill="none" stroke="#2f66c8" stroke-width="3"/><text x="60" y="410" font-size="21" fill="#203654" font-weight="400" text-anchor="start">Shaded strip = shared area.</text><text x="60" y="444" font-size="20" fill="#203654" font-weight="400" text-anchor="start">Touching edges also counts (&gt;= and &lt;=).</text><text x="465" y="185" font-size="21" fill="#203654" font-weight="700" text-anchor="start">Overlap across x:</text><text x="465" y="220" font-size="21" fill="#203654" font-weight="400" text-anchor="start">ballX + radius &gt;= paddleX</text><text x="465" y="252" font-size="21" fill="#203654" font-weight="400" text-anchor="start">ballX - radius &lt;= paddleX + paddleW</text><text x="465" y="303" font-size="21" fill="#203654" font-weight="700" text-anchor="start">Overlap across y:</text><text x="465" y="338" font-size="21" fill="#203654" font-weight="400" text-anchor="start">ballY + radius &gt;= paddleY</text><text x="465" y="370" font-size="21" fill="#203654" font-weight="400" text-anchor="start">ballY - radius &lt;= paddleY + paddleH</text><text x="465" y="420" font-size="20" fill="#b64444" font-weight="400" text-anchor="start">One false comparison → no paddle bounce.</text><rect x="25" y="495" width="950" height="320" rx="12" fill="white" stroke="#d5dfed" stroke-width="2"/><text x="45" y="531" font-size="25" fill="#147d68" font-weight="700" text-anchor="start">2  Respond only when dx &gt; 0 AND overlapsPaddle</text><text x="53" y="570" font-size="22" fill="#203654" font-weight="700" text-anchor="start">Before: moving right</text><rect x="315" y="587" width="22" height="120" rx="0" fill="#bde6f5" stroke="#2f66c8" stroke-width="2"/><circle cx="285" cy="645" r="40" fill="#dfd0f3" stroke="#7950ad" stroke-width="3"/><circle cx="285" cy="645" r="3" fill="#203654"/><path d="M165 645 L239 645" fill="none" stroke="#b64444" stroke-width="3" marker-end="url(#red)"/><text x="53" y="746" font-size="21" fill="#203654" font-weight="400" text-anchor="start">Ball overlaps the paddle slightly.</text><text x="53" y="783" font-size="21" fill="#147d68" font-weight="400" text-anchor="start">dy stays the same.</text><text x="533" y="570" font-size="22" fill="#203654" font-weight="700" text-anchor="start">After: moving left</text><rect x="795" y="587" width="22" height="120" rx="0" fill="#bde6f5" stroke="#2f66c8" stroke-width="2"/><circle cx="755" cy="645" r="40" fill="#dfd0f3" stroke="#7950ad" stroke-width="3"/><circle cx="755" cy="645" r="3" fill="#203654"/><path d="M709 645 L635 645" fill="none" stroke="#147d68" stroke-width="3" marker-end="url(#green)"/><text x="533" y="746" font-size="21" fill="#203654" font-weight="400" text-anchor="start">ballX = paddleX - radius</text><text x="533" y="783" font-size="21" fill="#147d68" font-weight="400" text-anchor="start">dx = -Math.abs(dx)</text><text x="30" y="853" font-size="22" fill="#203654" font-weight="400" text-anchor="start">Move the ball out to the paddle’s left face, then send it left and count one hit.</text><text x="30" y="887" font-size="22" fill="#203654" font-weight="400" text-anchor="start">The dx &gt; 0 check prevents another hit while the ball is already moving away.</text></g></svg>