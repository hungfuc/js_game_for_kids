<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img"><title>Add depth, and choose a coordinate convention</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2f66c8"/></marker></defs><rect width="1080" height="590" rx="18" fill="#f4f7fd"/><text x="36" y="49" fill="#203654" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Add depth, and choose a coordinate convention</tspan></text><text x="53" y="106" fill="#2f66c8" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start"><tspan x="53" dy="0">2D Canvas</tspan></text><path d="M99 157 L393 157" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><path d="M99 157 L99 402" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><text x="337" y="140" fill="#2f66c8" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="337" dy="0">+x</tspan></text><text x="116" y="398" fill="#2f66c8" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="116" dy="0">+y: down</tspan></text><text x="50" y="461" fill="#203654" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start"><tspan x="50" dy="0">Position = (x, y)</tspan><tspan x="50" dy="31.05">Gravity adds positive vy.</tspan></text><text x="550" y="106" fill="#7950ad" font-family="Arial,sans-serif" font-size="26" font-weight="700" text-anchor="start"><tspan x="550" dy="0">3D world used in this book</tspan></text><path d="M704 306 L981 306" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><path d="M704 306 L704 147" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><path d="M704 306 L575 418" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><text x="959" y="286" fill="#2f66c8" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="959" dy="0">+x</tspan></text><text x="722" y="161" fill="#2f66c8" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="722" dy="0">+y: up</tspan></text><text x="539" y="451" fill="#2f66c8" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="539" dy="0">+z</tspan></text><polygon points="665,291 713,273 760,299 711,319" fill="#96d8c8" stroke="#257f70" stroke-width="2"/><polygon points="665,291 711,319 711,361 665,333" fill="#4eac99" stroke="#257f70" stroke-width="2"/><polygon points="711,319 760,299 760,341 711,361" fill="#278777"/><text x="595" y="497" fill="#203654" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="595" dy="0">Position = (x, y, z)</tspan><tspan x="595" dy="29.700000000000003">Floor movement uses x and z.</tspan><tspan x="595" dy="29.700000000000003">Gravity points toward negative y.</tspan></text></svg>