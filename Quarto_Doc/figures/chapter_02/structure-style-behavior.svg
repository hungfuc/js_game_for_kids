<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" role="img" aria-labelledby="title desc">
<title id="title">Structure, Style, Behavior: build and test one game feature</title>
<desc id="desc">Begin with a goal and one small feature. Build the scene structure, style the scene, then program game behavior. Each stage includes a question, output, and check. Playtest by comparing an expected result with the observed result. If a change is needed, revise the relevant stage and check the following stages again. When the check passes, choose the next small feature.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker><marker id="loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#995520"/></marker></defs>
<rect width="1080" height="900" rx="24" fill="#f8fafc"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}.title{font-size:32px;font-weight:700}.heading{font-size:28px;font-weight:700}.label{font-size:19px;font-weight:700;letter-spacing:1px}.body{font-size:23px}.small{font-size:21px}.arrow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#arrow)}</style>
<text x="80" y="48" class="title"><tspan x="80" dy="0">STRUCTURE → STYLE → BEHAVIOR</tspan></text>
<rect x="265" y="78" width="550" height="98" rx="18" fill="#eef2ff" stroke="#6875b5" stroke-width="2"/>
<text x="290" y="111" class="label"><tspan x="290" dy="0">START WITH A SMALL FEATURE</tspan></text>
<text x="290" y="145" class="small"><tspan x="290" dy="0">Use your goal, story, rules, and paper sketch.</tspan></text>
<path class="arrow" d="M265 127H220V218"/>
<rect x="80" y="230" width="280" height="326" rx="18" fill="#e7f0ff" stroke="#3f71b5" stroke-width="2"/>
<text x="100" y="266" class="heading"><tspan x="100" dy="0">1  STRUCTURE</tspan></text>
<text x="100" y="300" class="small"><tspan x="100" dy="0">Build the scene structure</tspan></text>
<text x="100" y="343" class="small"><tspan x="100" dy="0">What parts are needed?</tspan><tspan x="100" dy="27">How do they fit together?</tspan></text>
<text x="100" y="409" class="label"><tspan x="100" dy="0">PRODUCE</tspan></text>
<text x="100" y="437" class="small"><tspan x="100" dy="0">Parts, groups, positions,</tspan><tspan x="100" dy="27">controls, and starting data.</tspan></text>
<text x="100" y="494" class="label"><tspan x="100" dy="0">CHECK</tspan></text>
<text x="100" y="521" class="small"><tspan x="100" dy="0">Every required part exists</tspan><tspan x="100" dy="25">and has a clear purpose.</tspan></text>
<rect x="400" y="230" width="280" height="326" rx="18" fill="#e7f6ed" stroke="#438761" stroke-width="2"/>
<text x="420" y="266" class="heading"><tspan x="420" dy="0">2  STYLE</tspan></text>
<text x="420" y="300" class="small"><tspan x="420" dy="0">Style the scene</tspan></text>
<text x="420" y="343" class="small"><tspan x="420" dy="0">Can players recognize</tspan><tspan x="420" dy="27">and understand the parts?</tspan></text>
<text x="420" y="409" class="label"><tspan x="420" dy="0">PRODUCE</tspan></text>
<text x="420" y="437" class="small"><tspan x="420" dy="0">Layout, colors, shapes,</tspan><tspan x="420" dy="27">artwork, and clear labels.</tspan></text>
<text x="420" y="494" class="label"><tspan x="420" dy="0">CHECK</tspan></text>
<text x="420" y="521" class="small"><tspan x="420" dy="0">Goal, controls, and objects</tspan><tspan x="420" dy="25">are easy to find.</tspan></text>
<rect x="720" y="230" width="280" height="326" rx="18" fill="#f3ebff" stroke="#8860ab" stroke-width="2"/>
<text x="740" y="266" class="heading"><tspan x="740" dy="0">3  BEHAVIOR</tspan></text>
<text x="740" y="300" class="small"><tspan x="740" dy="0">Program game behavior</tspan></text>
<text x="740" y="343" class="small"><tspan x="740" dy="0">What changes on input,</tspan><tspan x="740" dy="27">time, or a collision?</tspan></text>
<text x="740" y="409" class="label"><tspan x="740" dy="0">PRODUCE</tspan></text>
<text x="740" y="437" class="small"><tspan x="740" dy="0">Input, state, and rules;</tspan><tspan x="740" dy="27">movement, score, reset.</tspan></text>
<text x="740" y="494" class="label"><tspan x="740" dy="0">CHECK</tspan></text>
<text x="740" y="521" class="small"><tspan x="740" dy="0">One action produces</tspan><tspan x="740" dy="25">the result you predicted.</tspan></text>
<path class="arrow" d="M360 390H390"/><path class="arrow" d="M680 390H710"/><path class="arrow" d="M860 556V584H540V609"/>
<rect x="275" y="620" width="530" height="110" rx="18" fill="#fff3db" stroke="#b78a35" stroke-width="2"/>
<text x="300" y="657" class="heading"><tspan x="300" dy="0">PLAYTEST ONE ACTION</tspan></text>
<text x="300" y="693" class="body"><tspan x="300" dy="0">Predict → try → observe → compare.</tspan></text>
<path d="M275 675H36V390H69" fill="none" stroke="#995520" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#loop)"/>
<text x="70" y="601" class="small"><tspan x="70" dy="0">Needs a change?</tspan></text>
<text x="70" y="756" class="small"><tspan x="70" dy="0">Revise the relevant stage.</tspan><tspan x="70" dy="28">Recheck the stages that follow.</tspan></text>
<path class="arrow" d="M540 730V806"/>
<text x="561" y="798" class="small"><tspan x="561" dy="0">Check passed</tspan></text>
<rect x="305" y="819" width="470" height="57" rx="18" fill="#eef2ff" stroke="#6875b5" stroke-width="2"/>
<text x="329" y="855" class="body"><tspan x="329" dy="0">Choose the next small feature.</tspan></text>
</svg>
