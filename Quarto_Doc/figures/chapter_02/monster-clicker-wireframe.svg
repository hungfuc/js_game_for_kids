<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">Monster Clicker scene wireframe</title>
  <desc id="desc">A simple page layout with a main content box holding the game title, instructions, and a play section. The play section contains a heading, monster button, score, and feedback message in that order.</desc>
  <style>
    text { font-family: system-ui, sans-serif; fill: #183253; }
    .label { font-size: 21px; font-weight: 700; }
    .small { font-size: 17px; }
    .box { fill: #fff; stroke: #62798d; stroke-width: 2; }
    .part { fill: #f4f8fc; stroke: #7b91a4; stroke-width: 2; }
  </style>
  <rect width="900" height="650" rx="18" fill="#eef3f7"/>
  <text x="450" y="42" text-anchor="middle" class="label">Monster Clicker: a scene plan</text>
  <rect x="105" y="70" width="690" height="545" rx="13" class="box"/>
  <text x="130" y="101" class="small">Main content</text>
  <rect x="145" y="120" width="610" height="62" rx="6" class="part"/>
  <text x="450" y="159" text-anchor="middle" class="label">Title: Monster Clicker</text>
  <rect x="145" y="198" width="610" height="55" rx="6" class="part"/>
  <text x="450" y="232" text-anchor="middle" class="small">Instructions: Click the monster to collect points.</text>
  <rect x="145" y="271" width="610" height="310" rx="8" fill="#fff" stroke="#62798d" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="170" y="302" class="small">Play section</text>
  <rect x="180" y="319" width="540" height="47" rx="6" class="part"/>
  <text x="450" y="349" text-anchor="middle" class="small">Heading: Meet your monster</text>
  <rect x="265" y="386" width="370" height="61" rx="8" fill="#e6f6f2" stroke="#62798d" stroke-width="2"/>
  <text x="450" y="424" text-anchor="middle" class="label">Monster button</text>
  <rect x="180" y="467" width="540" height="40" rx="6" class="part"/>
  <text x="450" y="493" text-anchor="middle" class="small">Score: 0</text>
  <rect x="180" y="524" width="540" height="40" rx="6" class="part"/>
  <text x="450" y="550" text-anchor="middle" class="small">Message: Your adventure is ready.</text>
</svg>
