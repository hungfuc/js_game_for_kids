<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" role="img" aria-labelledby="title desc"><title id="title">Pong wall bounces and the right-side miss</title><desc id="desc">Left wall forces positive dx. Top and bottom reverse dy. The ball resets only after its left edge has passed the right canvas edge.</desc><defs><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b64444"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#147d68"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2f66c8"/></marker></defs><rect width="1000" height="810" rx="18" fill="#f4f7fd"/><g font-family="Arial, sans-serif"><text x="30" y="42" font-size="28" fill="#203654" font-weight="700" text-anchor="start">Pong: three walls bounce; the right side can be missed</text><text x="30" y="77" font-size="22" fill="#203654" font-weight="400" text-anchor="start">These are the wall and reset rules inside update(), after the ball moves.</text><rect x="25" y="105" width="470" height="292" rx="12" fill="white" stroke="#d5dfed" stroke-width="2"/><text x="43" y="137" font-size="25" fill="#2f66c8" font-weight="700" text-anchor="start">Left wall</text><path d="M90 165 L90 277" fill="none" stroke="#2f66c8" stroke-width="3"/><circle cx="110" cy="220" r="24" fill="#dfd0f3" stroke="#7950ad" stroke-width="3"/><circle cx="110" cy="220" r="3" fill="#203654"/><path d="M220 190 L138 190" fill="none" stroke="#b64444" stroke-width="3" marker-end="url(#red)"/><path d="M138 250 L220 250" fill="none" stroke="#147d68" stroke-width="3" marker-end="url(#green)"/><text x="255" y="217" font-size="21" fill="#203654" font-weight="400" text-anchor="start">dx &lt; 0 → dx &gt; 0</text><text x="43" y="330" font-size="21" fill="#203654" font-weight="700" text-anchor="start">ballX &lt; radius</text><text x="43" y="361" font-size="21" fill="#147d68" font-weight="400" text-anchor="start">dx = Math.abs(dx)</text><text x="43" y="391" font-size="19" fill="#203654" font-weight="400" text-anchor="start">Always send the ball right.</text><rect x="515" y="105" width="470" height="292" rx="12" fill="white" stroke="#d5dfed" stroke-width="2"/><text x="533" y="137" font-size="25" fill="#2f66c8" font-weight="700" text-anchor="start">Top wall</text><path d="M560 175 L680 175" fill="none" stroke="#2f66c8" stroke-width="3"/><circle cx="620" cy="195" r="24" fill="#dfd0f3" stroke="#7950ad" stroke-width="3"/><circle cx="620" cy="195" r="3" fill="#203654"/><path d="M585 260 L585 203" fill="none" stroke="#b64444" stroke-width="3" marker-end="url(#red)"/><path d="M655 203 L655 260" fill="none" stroke="#147d68" stroke-width="3" marker-end="url(#green)"/><text x="715" y="220" font-size="21" fill="#203654" font-weight="400" text-anchor="start">dy &lt; 0 → dy &gt; 0</text><text x="533" y="330" font-size="21" fill="#203654" font-weight="700" text-anchor="start">ballY &lt; radius</text><text x="533" y="361" font-size="21" fill="#147d68" font-weight="400" text-anchor="start">dy = -dy</text><text x="533" y="391" font-size="19" fill="#203654" font-weight="400" text-anchor="start">Up becomes down; dx stays the same.</text><rect x="25" y="415" width="470" height="292" rx="12" fill="white" stroke="#d5dfed" stroke-width="2"/><text x="43" y="447" font-size="25" fill="#2f66c8" font-weight="700" text-anchor="start">Bottom wall</text><path d="M70 585 L190 585" fill="none" stroke="#2f66c8" stroke-width="3"/><circle cx="130" cy="565" r="24" fill="#dfd0f3" stroke="#7950ad" stroke-width="3"/><circle cx="130" cy="565" r="3" fill="#203654"/><path d="M95 500 L95 557" fill="none" stroke="#b64444" stroke-width="3" marker-end="url(#red)"/><path d="M165 557 L165 500" fill="none" stroke="#147d68" stroke-width="3" marker-end="url(#green)"/><text x="225" y="530" font-size="21" fill="#203654" font-weight="400" text-anchor="start">dy &gt; 0 → dy &lt; 0</text><text x="43" y="640" font-size="21" fill="#203654" font-weight="700" text-anchor="start">ballY &gt; canvas.height - radius</text><text x="43" y="671" font-size="21" fill="#147d68" font-weight="400" text-anchor="start">dy = -dy</text><text x="43" y="701" font-size="19" fill="#203654" font-weight="400" text-anchor="start">Down becomes up; dx stays the same.</text><rect x="515" y="415" width="470" height="292" rx="12" fill="white" stroke="#d5dfed" stroke-width="2"/><text x="533" y="447" font-size="25" fill="#2f66c8" font-weight="700" text-anchor="start">Miss on the right</text><path d="M805 475 L805 590" fill="none" stroke="#2f66c8" stroke-width="3"/><circle cx="840" cy="520" r="24" fill="#dfd0f3" stroke="#7950ad" stroke-width="3"/><circle cx="840" cy="520" r="3" fill="#203654"/><path d="M720 520 L807 520" fill="none" stroke="#b64444" stroke-width="3" marker-end="url(#red)"/><circle cx="600" cy="545" r="24" fill="#dfd0f3" stroke="#7950ad" stroke-width="3"/><circle cx="600" cy="545" r="3" fill="#203654"/><text x="550" y="590" font-size="18" fill="#147d68" font-weight="400" text-anchor="start">reset here</text><text x="730" y="610" font-size="18" fill="#203654" font-weight="400" text-anchor="start">right edge</text><text x="533" y="640" font-size="21" fill="#203654" font-weight="700" text-anchor="start">ballX &gt; canvas.width + radius</text><text x="533" y="671" font-size="21" fill="#147d68" font-weight="400" text-anchor="start">Reset position; dx = Math.abs(dx)</text><text x="533" y="701" font-size="19" fill="#203654" font-weight="400" text-anchor="start">The whole ball must leave the canvas.</text><text x="30" y="754" font-size="22" fill="#203654" font-weight="400" text-anchor="start">The right paddle has its own overlap test. Missing it does not reverse dx.</text><text x="30" y="786" font-size="22" fill="#203654" font-weight="400" text-anchor="start">A reset starts at ballX = 100 and ballY = canvas.height / 2, moving right.</text></g></svg>