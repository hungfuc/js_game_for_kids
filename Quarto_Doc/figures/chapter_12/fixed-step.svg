<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img"><title>The game has input, simulation, and drawing</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2f66c8"/></marker></defs><rect width="1080" height="590" rx="18" fill="#f4f7fd"/><text x="36" y="49" fill="#203654" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start"><tspan x="36" dy="0">The game has input, simulation, and drawing</tspan></text><rect x="38" y="99" width="268" height="145" rx="14" fill="white" stroke="#20866f" stroke-width="2"/><text x="56" y="133" fill="#20866f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="56" dy="0">1. Remember input</tspan></text><text x="56" y="169" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Right held? yes</tspan><tspan x="56" dy="27.0">Jump pressed? once</tspan></text><rect x="389" y="99" width="300" height="145" rx="14" fill="white" stroke="#2f66c8" stroke-width="2"/><text x="407" y="133" fill="#2f66c8" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="407" dy="0">2. Simulate a small step</tspan></text><text x="407" y="169" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="407" dy="0">Move; test; respond</tspan><tspan x="407" dy="27.0">dt = 1 / 120 second</tspan></text><rect x="770" y="99" width="270" height="145" rx="14" fill="white" stroke="#7950ad" stroke-width="2"/><text x="788" y="133" fill="#7950ad" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="788" dy="0">3. Draw the result</tspan></text><text x="788" y="169" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="788" dy="0">Picture of current state</tspan><tspan x="788" dy="27.0">Browser repaint</tspan></text><path d="M307 171 L385 171" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><path d="M690 171 L765 171" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="303" fill="#203654" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="45" dy="0">One drawing frame may contain several simulation steps.</tspan></text><rect x="50" y="341" width="104" height="62" fill="#dbe9ff" stroke="#2f66c8" stroke-width="3"/><text x="102" y="378" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="102" dy="0">step 1</tspan></text><rect x="165" y="341" width="104" height="62" fill="#dbe9ff" stroke="#2f66c8" stroke-width="3"/><text x="217" y="378" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="217" dy="0">step 2</tspan></text><rect x="280" y="341" width="104" height="62" fill="#dbe9ff" stroke="#2f66c8" stroke-width="3"/><text x="332" y="378" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="332" dy="0">step 3</tspan></text><rect x="395" y="341" width="104" height="62" fill="#dbe9ff" stroke="#2f66c8" stroke-width="3"/><text x="447" y="378" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="447" dy="0">step 4</tspan></text><rect x="510" y="341" width="104" height="62" fill="#dbe9ff" stroke="#2f66c8" stroke-width="3"/><text x="562" y="378" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="562" dy="0">step 5</tspan></text><rect x="625" y="341" width="104" height="62" fill="#dbe9ff" stroke="#2f66c8" stroke-width="3"/><text x="677" y="378" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="677" dy="0">step 6</tspan></text><rect x="740" y="341" width="104" height="62" fill="#dbe9ff" stroke="#2f66c8" stroke-width="3"/><text x="792" y="378" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="792" dy="0">step 7</tspan></text><rect x="855" y="341" width="104" height="62" fill="#dbe9ff" stroke="#2f66c8" stroke-width="3"/><text x="907" y="378" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="middle"><tspan x="907" dy="0">step 8</tspan></text><text x="50" y="453" fill="#203654" font-family="Arial,sans-serif" font-size="24" font-weight="400" text-anchor="start"><tspan x="50" dy="0">Speed is measured in pixels per second.</tspan><tspan x="50" dy="32.400000000000006">distance = speed x seconds</tspan><tspan x="50" dy="32.400000000000006">240 pixels/second x (1/120) second = 2 pixels per step</tspan></text></svg>