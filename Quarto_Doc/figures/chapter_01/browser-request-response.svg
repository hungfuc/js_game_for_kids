<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc">
<title id="title">A browser requests files and a web server responds</title>
<desc id="desc">A browser wireframe on the left sends a request to a web server on the right. The server sends files back in a response. The browser uses them to display a page.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#245d88"/></marker><style>text{font-family:system-ui,sans-serif;fill:#183253}.heading{font-size:24px;font-weight:700}.label{font-size:19px}.small{font-size:17px}.arrow{fill:none;stroke:#245d88;stroke-width:3;marker-end:url(#arrow)}</style></defs>
<rect width="1100" height="440" rx="18" fill="#f4f8fc"/>
<text x="550" y="43" text-anchor="middle" class="heading">A browser asks. A web server answers.</text>
<rect x="35" y="92" width="320" height="255" rx="12" fill="white" stroke="#245d88" stroke-width="2"/>
<path d="M35 150H355" stroke="#245d88" stroke-width="2"/>
<circle cx="54" cy="111" r="4" fill="#245d88"/><circle cx="68" cy="111" r="4" fill="#245d88"/>
<rect x="53" y="122" width="280" height="19" rx="5" fill="#e7eff6"/>
<text x="63" y="136" font-size="12">https://example.com/games/space-quest</text>
<text x="59" y="190" class="heading">Space Quest</text>
<rect x="59" y="209" width="270" height="78" rx="6" fill="#e6f6f2"/>
<text x="194" y="255" text-anchor="middle" class="label">Game page</text>
<text x="59" y="323" class="small">3. Use the files to show the page.</text>
<text x="195" y="386" text-anchor="middle" class="heading">Browser (client)</text>
<path d="M380 180H745" class="arrow"/>
<text x="563" y="132" text-anchor="middle" class="label">1. Request</text>
<text x="563" y="159" text-anchor="middle" class="small">Please send the game page.</text>
<path d="M745 273H380" class="arrow"/>
<text x="563" y="242" text-anchor="middle" class="label">2. Response</text>
<text x="563" y="308" text-anchor="middle" class="small">Page HTML; other requests can load</text>
<text x="563" y="333" text-anchor="middle" class="small">CSS, JavaScript, and pictures.</text>
<rect x="775" y="92" width="285" height="255" rx="14" fill="#e9e3fa" stroke="#245d88" stroke-width="2"/>
<rect x="817" y="124" width="202" height="47" rx="7" fill="white" stroke="#245d88" stroke-width="2"/>
<rect x="817" y="185" width="202" height="47" rx="7" fill="white" stroke="#245d88" stroke-width="2"/>
<circle cx="840" cy="148" r="6" fill="#36a88d"/><circle cx="840" cy="209" r="6" fill="#36a88d"/>
<path d="M866 148H994M866 209H994" stroke="#a5b8cc" stroke-width="5"/>
<text x="918" y="277" text-anchor="middle" class="label">Receives requests</text>
<text x="918" y="306" text-anchor="middle" class="label">and sends files</text>
<text x="918" y="386" text-anchor="middle" class="heading">Web server</text>
<text x="550" y="420" text-anchor="middle" class="small">The arrows represent messages traveling through a network.</text>
</svg>
