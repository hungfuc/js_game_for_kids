<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img"><title>Collisions become game rules</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2f66c8"/></marker></defs><rect width="1080" height="590" rx="18" fill="#f4f7fd"/><text x="36" y="49" fill="#203654" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Collisions become game rules</tspan></text><rect x="44" y="106" width="430" height="134" rx="14" fill="white" stroke="#2f66c8" stroke-width="2"/><text x="62" y="140" fill="#2f66c8" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="62" dy="0">Solid collision</tspan></text><text x="62" y="176" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="62" dy="0">Marble + floor, wall, or crate</tspan><tspan x="62" dy="27.0">Rapier pushes bodies apart.</tspan></text><rect x="606" y="106" width="430" height="134" rx="14" fill="white" stroke="#7950ad" stroke-width="2"/><text x="624" y="140" fill="#7950ad" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="624" dy="0">Sensor overlap</tspan></text><text x="624" y="176" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="624" dy="0">Marble + collectible or goal</tspan><tspan x="624" dy="27.0">Report overlap; do not block motion.</tspan></text><path d="M820 246 L820 296" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><rect x="606" y="300" width="430" height="130" rx="14" fill="white" stroke="#20866f" stroke-width="2"/><text x="624" y="334" fill="#20866f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="624" dy="0">Handle the event once</tspan></text><text x="624" y="370" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="624" dy="0">Check the player collider handle</tspan><tspan x="624" dy="27.0">Ignore an already-collected gem</tspan></text><rect x="44" y="300" width="430" height="130" rx="14" fill="white" stroke="#b43c61" stroke-width="2"/><text x="62" y="334" fill="#b43c61" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="62" dy="0">Update game state</tspan></text><text x="62" y="370" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="62" dy="0">score = score + 1</tspan><tspan x="62" dy="27.0">Hide the gem; remove its physics body</tspan></text><path d="M602 366 L480 366" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><path d="M252 436 L252 480" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><text x="53" y="526" fill="#20866f" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start"><tspan x="53" dy="0">All gems + inside goal = WIN</tspan></text><text x="603" y="505" fill="#203654" font-family="Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="603" dy="0">An overlap is not automatically a win.</tspan><tspan x="603" dy="29.700000000000003">The game rule makes that decision.</tspan></text></svg>