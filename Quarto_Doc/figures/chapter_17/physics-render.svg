<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="590" viewBox="0 0 1080 590" role="img"><title>Two representations; one source of movement</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2f66c8"/></marker></defs><rect width="1080" height="590" rx="18" fill="#f4f7fd"/><text x="36" y="49" fill="#203654" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Two representations; one source of movement</tspan></text><rect x="45" y="107" width="443" height="161" rx="14" fill="white" stroke="#2f66c8" stroke-width="2"/><text x="63" y="141" fill="#2f66c8" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="63" dy="0">Rapier: the invisible simulation</tspan></text><text x="63" y="177" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="63" dy="0">Rigid body: position, velocity, mass</tspan><tspan x="63" dy="27.0">Collider: contact shape</tspan><tspan x="63" dy="27.0">World: gravity and collision response</tspan></text><rect x="595" y="107" width="440" height="161" rx="14" fill="white" stroke="#7950ad" stroke-width="2"/><text x="613" y="141" fill="#7950ad" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="613" dy="0">Three.js: the visible scene</tspan></text><text x="613" y="177" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="613" dy="0">Mesh or loaded GLB</tspan><tspan x="613" dy="27.0">Geometry, material, light, camera</tspan><tspan x="613" dy="27.0">Renderer draws the current picture</tspan></text><path d="M489 184 L588 184" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><text x="498" y="155" fill="#2f66c8" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="498" dy="0">copy</tspan></text><rect x="45" y="331" width="290" height="129" rx="14" fill="white" stroke="#20866f" stroke-width="2"/><text x="63" y="365" fill="#20866f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="63" dy="0">Step physics</tspan></text><text x="63" y="401" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="63" dy="0">world.timestep = 1/60</tspan><tspan x="63" dy="27.0">world.step(events)</tspan></text><rect x="395" y="331" width="291" height="129" rx="14" fill="white" stroke="#2f66c8" stroke-width="2"/><text x="413" y="365" fill="#2f66c8" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="413" dy="0">Synchronize</tspan></text><text x="413" y="401" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="413" dy="0">copy body translation</tspan><tspan x="413" dy="27.0">copy body quaternion</tspan></text><rect x="745" y="331" width="290" height="129" rx="14" fill="white" stroke="#7950ad" stroke-width="2"/><text x="763" y="365" fill="#7950ad" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="763" dy="0">Render</tspan></text><text x="763" y="401" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="763" dy="0">renderer.render(...)</tspan><tspan x="763" dy="27.0">No extra gravity here.</tspan></text><path d="M336 397 L389 397" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><path d="M687 397 L739 397" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><text x="48" y="529" fill="#203654" font-family="Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="48" dy="0">The physics body owns movement. The mesh follows it.</tspan></text></svg>