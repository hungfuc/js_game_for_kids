<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" role="img"><title>Your model needs a size, an origin, and a job</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2f66c8"/></marker></defs><rect width="1080" height="610" rx="18" fill="#f4f7fd"/><text x="36" y="49" fill="#203654" font-family="Arial,sans-serif" font-size="29" font-weight="700" text-anchor="start"><tspan x="36" dy="0">Your model needs a size, an origin, and a job</tspan></text><rect x="38" y="106" width="293" height="157" rx="14" fill="white" stroke="#20866f" stroke-width="2"/><text x="56" y="140" fill="#20866f" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="56" dy="0">1. Author the asset</tspan></text><text x="56" y="176" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Robot, crate, or gem</tspan><tspan x="56" dy="27.0">Choose scale and origin</tspan><tspan x="56" dy="27.0">Export a GLB file</tspan></text><rect x="394" y="106" width="289" height="157" rx="14" fill="white" stroke="#2f66c8" stroke-width="2"/><text x="412" y="140" fill="#2f66c8" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="412" dy="0">2. Load the model</tspan></text><text x="412" y="176" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="412" dy="0">GLTFLoader.loadAsync</tspan><tspan x="412" dy="27.0">Wait for the Promise</tspan><tspan x="412" dy="27.0">Add gltf.scene</tspan></text><rect x="745" y="106" width="296" height="157" rx="14" fill="white" stroke="#7950ad" stroke-width="2"/><text x="763" y="140" fill="#7950ad" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="763" dy="0">3. Place the visual</tspan></text><text x="763" y="176" fill="#203654" font-family="Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="763" dy="0">Position and rotate</tspan><tspan x="763" dy="27.0">Keep art under a root</tspan><tspan x="763" dy="27.0">Use simple colliders</tspan></text><path d="M332 185 L388 185" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><path d="M684 185 L739 185" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><text x="47" y="325" fill="#20866f" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="47" dy="0">Robot: origin at the feet</tspan></text><rect x="154" y="363" width="77" height="97" fill="#72ccbf" stroke="#20866f" stroke-width="3"/><rect x="139" y="332" width="105" height="53" fill="#9ee2d6" stroke="#20866f" stroke-width="3"/><path d="M192 531 L192 477" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><text x="57" y="563" fill="#203654" font-family="Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="57" dy="0">(0, 0, 0) is on the floor.</tspan></text><text x="456" y="325" fill="#7950ad" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="start"><tspan x="456" dy="0">Crate: origin at its center</tspan></text><rect x="593" y="360" width="120" height="120" fill="#edc28c" stroke="#af6c20" stroke-width="3"/><circle cx="653" cy="420" r="6" fill="#b43c61"/><path d="M851 420 L666 420" fill="none" stroke="#2f66c8" stroke-width="3" marker-end="url(#arrow)"/><text x="792" y="395" fill="#203654" font-family="Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="792" dy="0">center = body position</tspan></text><text x="444" y="535" fill="#203654" font-family="Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start"><tspan x="444" dy="0">Full size: 1 x 1 x 1</tspan><tspan x="444" dy="31.05">Rapier half-extents: 0.5, 0.5, 0.5</tspan></text></svg>