<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="395" viewBox="0 0 1100 395" role="img" aria-labelledby="title desc">
  <title id="title">CSS rules matched to HTML lines</title>
  <desc id="desc">CSS line 1 h1 points to HTML line 10 heading. CSS line 4 dot monster points to HTML line 12 button with class monster. CSS line 12 hash message points to HTML line 14 paragraph with ID message.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto">
      <path d="M0 0 L11 4.5 L0 9 Z" fill="#315b82"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, sans-serif; fill: #183253; }
    .heading { font-size: 22px; font-weight: 700; }
    .code { font-family: monospace; font-size: 20px; }
    .note { font-size: 16px; fill: #445b70; }
    .box { fill: #fff; stroke: #9baebe; stroke-width: 2; }
    .line { stroke: #315b82; stroke-width: 3; fill: none; marker-end: url(#arrow); }
  </style>
  <rect width="1100" height="395" rx="16" fill="#f1f5f9"/>
  <text x="55" y="45" class="heading">styles.css: rule begins</text>
  <text x="645" y="45" class="heading">index.html: element matched</text>
  <rect x="40" y="75" width="420" height="78" rx="8" class="box"/>
  <text x="60" y="122" class="code">1  h1 {</text>
  <path d="M465 114 H620" class="line"/>
  <rect x="635" y="75" width="425" height="78" rx="8" class="box"/>
  <text x="655" y="122" class="code">10  &lt;h1&gt;Monster Clicker&lt;/h1&gt;</text>
  <rect x="40" y="175" width="420" height="78" rx="8" class="box"/>
  <text x="60" y="222" class="code">4  .monster {</text>
  <path d="M465 214 H620" class="line"/>
  <rect x="635" y="175" width="425" height="78" rx="8" class="box"/>
  <text x="655" y="209" class="code">12  &lt;button class="monster"</text>
  <text x="655" y="236" class="code">    ...&gt;Monster&lt;/button&gt;</text>
  <rect x="40" y="275" width="420" height="78" rx="8" class="box"/>
  <text x="60" y="322" class="code">12  #message {</text>
  <path d="M465 314 H620" class="line"/>
  <rect x="635" y="275" width="425" height="78" rx="8" class="box"/>
  <text x="655" y="309" class="code">14  &lt;p id="message"&gt;Your</text>
  <text x="655" y="336" class="code">    adventure is ready.&lt;/p&gt;</text>
  <text x="55" y="381" class="note">The dot matches a class. The # matches an ID. A bare tag name matches that type of element.</text>
</svg>
