<!doctype html>
<html>
<body>
  <!-- Development flow: Build the scene structure -> Style the scene -> Program game behavior. -->
  <!-- Step 1: Build the scene structure (page structure): character and message. -->
  <!-- Step 2: This small interaction example uses the browser default style. -->
  <h1>Click the Gem!</h1>
  <img id="gem" src="gem.svg"
       alt="A purple gem. Click it to collect it." width="96">
  <p id="message">The gem is waiting.</p>

  <!-- Step 3: Program game behavior (game operations and actions), taught in Chapter 4. -->
  <script>
    const gem = document.getElementById("gem");
    const message = document.getElementById("message");

    function collectGem() {
      message.textContent = "You collected the gem!";
    }

    gem.addEventListener("click", collectGem);
  </script>
</body>
</html>
